<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TextTruth AI — AI vs Human Text Detector</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            ai: { 50: '#fff1f0', 100: '#ffe0de', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 900: '#450a0a' },
            human: { 50: '#f0fdf4', 100: '#dcfce7', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 900: '#052e16' },
            neutral: { 850: '#1a1a2e', 900: '#0f0f1a', 950: '#07070f' },
          },
          animation: {
            'spin-slow': 'spin 2s linear infinite',
            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
            'slide-up': 'slideUp 0.4s ease-out',
            'fade-in': 'fadeIn 0.3s ease-out',
          },
          keyframes: {
            pulseGlow: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.5 },
            },
            slideUp: {
              from: { transform: 'translateY(20px)', opacity: 0 },
              to: { transform: 'translateY(0)', opacity: 1 },
            },
            fadeIn: {
              from: { opacity: 0 },
              to: { opacity: 1 },
            }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .gradient-text {
      background: linear-gradient(135deg, #6366f1, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .noise::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: inherit;
    }
    .score-ring {
      transform-origin: center;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
    .history-item { transition: all 0.2s ease; }
    .history-item:hover { transform: translateX(4px); }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API_URL = 'http://localhost:5000';

const ScanIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
    <rect x="7" y="7" width="10" height="10" rx="1"/>
  </svg>
);

const MoonIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
);

const SunIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
);

const DownloadIcon = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
);

const TrashIcon = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
    <path d="M10 11v6M14 11v6"/>
  </svg>
);

const CircleScore = ({ score, isAI, size = 140 }) => {
  const radius = 52;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (score / 100) * circumference;
  const color = isAI ? '#ef4444' : '#22c55e';
  const glow = isAI ? '#ef444444' : '#22c55e44';

  return (
    <svg width={size} height={size} viewBox="0 0 120 120">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="60" cy="60" r={radius} fill="none" stroke={glow} strokeWidth="10" opacity="0.3"/>
      <circle cx="60" cy="60" r={radius} fill="none" stroke="currentColor" strokeWidth="1" opacity="0.1" className="text-gray-400"/>
      <circle
        cx="60" cy="60" r={radius}
        fill="none"
        stroke={color}
        strokeWidth="8"
        strokeLinecap="round"
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        className="score-ring"
        style={{ transform: 'rotate(-90deg)', transformOrigin: '60px 60px' }}
        filter="url(#glow)"
      />
      <text x="60" y="55" textAnchor="middle" dominantBaseline="middle" fill={color} fontSize="22" fontWeight="700" fontFamily="Syne, sans-serif">
        {score}%
      </text>
      <text x="60" y="73" textAnchor="middle" dominantBaseline="middle" fill="#9ca3af" fontSize="9" fontFamily="Space Grotesk, sans-serif">
        confidence
      </text>
    </svg>
  );
};

const LoadingDots = () => (
  <div className="flex items-center gap-2">
    {[0, 1, 2].map(i => (
      <div
        key={i}
        className="w-2 h-2 rounded-full bg-indigo-400"
        style={{
          animation: `bounce 1.2s ease-in-out ${i * 0.2}s infinite`,
        }}
      />
    ))}
    <style>{`
      @keyframes bounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    `}</style>
  </div>
);

function App() {
  const [dark, setDark] = useState(true);
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [history, setHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem('texttruth_history') || '[]'); }
    catch { return []; }
  });
  const [showHistory, setShowHistory] = useState(false);
  const [animateResult, setAnimateResult] = useState(false);
  const textareaRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  useEffect(() => {
    localStorage.setItem('texttruth_history', JSON.stringify(history));
  }, [history]);

  const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
  const charCount = text.length;

  const handleDetect = async () => {
    if (!text.trim()) { setError('Please enter some text to analyze.'); return; }
    if (text.trim().length < 20) { setError('Text is too short. Please enter at least 20 characters.'); return; }

    setLoading(true);
    setError('');
    setResult(null);
    setAnimateResult(false);

    try {
      const res = await fetch(`${API_URL}/predict`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text.trim() }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Server error');
      }

      const data = await res.json();
      setResult(data);
      setAnimateResult(true);

      const newEntry = {
        id: Date.now(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toLocaleDateString(),
        preview: text.trim().slice(0, 60) + (text.length > 60 ? '…' : ''),
        label: data.label,
        confidence: data.confidence,
      };
      setHistory(prev => [newEntry, ...prev].slice(0, 5));

    } catch (e) {
      setError(e.message.includes('Failed to fetch')
        ? 'Cannot reach the backend. Make sure Flask is running on port 5000.'
        : e.message);
    } finally {
      setLoading(false);
    }
  };

  const handleClear = () => {
    setText('');
    setResult(null);
    setError('');
    textareaRef.current?.focus();
  };

  const handleDownload = () => {
    if (!result) return;
    const content = `TextTruth AI — Detection Report
================================
Date: ${new Date().toLocaleString()}
Model: ${result.model_used}

RESULT: ${result.label}
Confidence: ${result.confidence}%
AI Score: ${result.ai_score}%

Explanation:
${result.explanation}

Analyzed Text:
--------------
${text}

================================
Generated by TextTruth AI
`;
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `texttruth-report-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const isAI = result?.label === 'AI Generated';

  return (
    <div className={`min-h-screen transition-colors duration-300 ${dark ? 'bg-neutral-950 text-white' : 'bg-slate-50 text-gray-900'}`}>
      {/* Background grid */}
      <div className="fixed inset-0 pointer-events-none overflow-hidden">
        <div
          className="absolute inset-0 opacity-[0.03]"
          style={{
            backgroundImage: `linear-gradient(rgba(99,102,241,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.5) 1px, transparent 1px)`,
            backgroundSize: '40px 40px'
          }}
        />
        <div className={`absolute top-0 left-1/4 w-96 h-96 rounded-full blur-3xl opacity-10 ${dark ? 'bg-indigo-500' : 'bg-indigo-300'}`} />
        <div className={`absolute bottom-0 right-1/4 w-96 h-96 rounded-full blur-3xl opacity-10 ${dark ? 'bg-purple-500' : 'bg-purple-300'}`} />
      </div>

      {/* Header */}
      <header className={`relative z-10 border-b ${dark ? 'border-white/5 bg-black/20' : 'border-black/5 bg-white/60'} glass`}>
        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
              <ScanIcon />
            </div>
            <span className="font-display font-bold text-xl gradient-text">TextTruth AI</span>
          </div>
          <div className="flex items-center gap-3">
            <button
              onClick={() => setShowHistory(!showHistory)}
              className={`text-sm px-3 py-1.5 rounded-lg border transition-all ${dark ? 'border-white/10 hover:bg-white/5 text-gray-300' : 'border-black/10 hover:bg-black/5 text-gray-600'}`}
            >
              History {history.length > 0 && <span className="ml-1 text-indigo-400 font-semibold">{history.length}</span>}
            </button>
            <button
              onClick={() => setDark(!dark)}
              className={`w-9 h-9 rounded-lg border flex items-center justify-center transition-all ${dark ? 'border-white/10 hover:bg-white/5 text-yellow-300' : 'border-black/10 hover:bg-black/5 text-indigo-600'}`}
            >
              {dark ? <SunIcon /> : <MoonIcon />}
            </button>
          </div>
        </div>
      </header>

      <main className="relative z-10 max-w-5xl mx-auto px-4 py-10">

        {/* Hero */}
        <div className="text-center mb-10">
          <div className={`inline-flex items-center gap-2 text-xs px-3 py-1.5 rounded-full border mb-4 ${dark ? 'border-indigo-500/30 bg-indigo-500/10 text-indigo-300' : 'border-indigo-500/30 bg-indigo-50 text-indigo-600'}`}>
            <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse" />
            Powered by RoBERTa · OpenAI Detector
          </div>
          <h1 className="font-display font-extrabold text-4xl md:text-5xl mb-3">
            <span className="gradient-text">AI vs Human</span>
            <br />
            <span className={dark ? 'text-white' : 'text-gray-900'}>Text Detector</span>
          </h1>
          <p className={`text-base max-w-xl mx-auto ${dark ? 'text-gray-400' : 'text-gray-500'}`}>
            Paste any text and instantly know if it was written by a human or generated by AI — with confidence scoring.
          </p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">

          {/* Input Panel */}
          <div className="lg:col-span-3">
            <div className={`relative rounded-2xl border overflow-hidden ${dark ? 'bg-black/30 border-white/8' : 'bg-white border-black/8'} glass`}>
              <div className={`px-4 py-3 border-b flex items-center justify-between ${dark ? 'border-white/5' : 'border-black/5'}`}>
                <span className={`text-sm font-medium ${dark ? 'text-gray-300' : 'text-gray-600'}`}>Input Text</span>
                <div className={`flex gap-4 text-xs ${dark ? 'text-gray-500' : 'text-gray-400'}`}>
                  <span><span className={dark ? 'text-gray-300' : 'text-gray-700'}>{wordCount}</span> words</span>
                  <span><span className={dark ? 'text-gray-300' : 'text-gray-700'}>{charCount}</span> chars</span>
                </div>
              </div>

              <textarea
                ref={textareaRef}
                value={text}
                onChange={e => setText(e.target.value)}
                placeholder="Paste or type your text here... (minimum 20 characters)"
                rows={12}
                className={`w-full px-5 py-4 text-sm resize-none outline-none transition-colors ${dark ? 'bg-transparent text-gray-100 placeholder-gray-600' : 'bg-transparent text-gray-800 placeholder-gray-400'}`}
                onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleDetect(); }}
              />

              <div className={`px-4 py-3 border-t flex items-center gap-3 ${dark ? 'border-white/5' : 'border-black/5'}`}>
                <button
                  onClick={handleDetect}
                  disabled={loading || !text.trim()}
                  className="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed shadow-lg shadow-indigo-500/20"
                >
                  {loading ? (
                    <><LoadingDots /><span className="ml-1">Analyzing…</span></>
                  ) : (
                    <><ScanIcon /><span>Detect</span></>
                  )}
                </button>
                <button
                  onClick={handleClear}
                  className={`px-4 py-2.5 rounded-xl border text-sm font-medium transition-all ${dark ? 'border-white/10 hover:bg-white/5 text-gray-300' : 'border-black/10 hover:bg-black/5 text-gray-600'}`}
                >
                  Clear
                </button>
              </div>
            </div>

            {/* Error */}
            {error && (
              <div className="mt-3 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm animate-fade-in">
                ⚠ {error}
              </div>
            )}

            {/* Tip */}
            <p className={`mt-2 text-xs text-center ${dark ? 'text-gray-600' : 'text-gray-400'}`}>
              Tip: Press ⌘ + Enter to analyze
            </p>
          </div>

          {/* Results Panel */}
          <div className="lg:col-span-2 flex flex-col gap-4">

            {/* Loading skeleton */}
            {loading && (
              <div className={`rounded-2xl border p-6 ${dark ? 'bg-black/30 border-white/8' : 'bg-white border-black/8'}`}>
                <div className="flex flex-col items-center gap-4">
                  <div className="w-32 h-32 rounded-full border-4 border-indigo-500/20 flex items-center justify-center">
                    <div className="w-8 h-8 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin" />
                  </div>
                  <div className="text-center">
                    <div className={`h-3 w-32 rounded-full mb-2 shimmer ${dark ? 'bg-white/10' : 'bg-black/10'}`} />
                    <div className={`h-2 w-48 rounded-full shimmer ${dark ? 'bg-white/5' : 'bg-black/5'}`} />
                  </div>
                </div>
              </div>
            )}

            {/* Result Card */}
            {result && !loading && (
              <div className={`rounded-2xl border p-6 transition-all ${animateResult ? 'animate-slide-up' : ''} ${dark
                ? isAI ? 'bg-red-950/20 border-red-500/20' : 'bg-green-950/20 border-green-500/20'
                : isAI ? 'bg-red-50 border-red-200' : 'bg-green-50 border-green-200'
              }`}>
                <div className="flex flex-col items-center text-center">
                  <CircleScore score={result.confidence} isAI={isAI} />

                  <div className={`mt-3 px-4 py-1.5 rounded-full text-sm font-bold ${
                    isAI
                      ? dark ? 'bg-red-500/20 text-red-400' : 'bg-red-100 text-red-700'
                      : dark ? 'bg-green-500/20 text-green-400' : 'bg-green-100 text-green-700'
                  }`}>
                    {isAI ? '🤖 AI Generated' : '✍️ Human Written'}
                  </div>

                  <p className={`mt-3 text-xs leading-relaxed ${dark ? 'text-gray-400' : 'text-gray-500'}`}>
                    {result.explanation}
                  </p>

                  <div className={`mt-4 w-full pt-4 border-t ${dark ? 'border-white/5' : 'border-black/5'} flex justify-between text-xs`}>
                    <span className={dark ? 'text-gray-500' : 'text-gray-400'}>
                      AI score: <span className={`font-semibold ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{result.ai_score}%</span>
                    </span>
                    <span className={dark ? 'text-gray-500' : 'text-gray-400'}>
                      {result.model_used === 'heuristic' ? '⚡ Heuristic' : '🧠 RoBERTa'}
                    </span>
                  </div>

                  <button
                    onClick={handleDownload}
                    className={`mt-4 w-full flex items-center justify-center gap-2 py-2 rounded-xl border text-xs font-medium transition-all ${dark ? 'border-white/10 hover:bg-white/5 text-gray-400' : 'border-black/10 hover:bg-black/5 text-gray-500'}`}
                  >
                    <DownloadIcon /> Download Report
                  </button>
                </div>
              </div>
            )}

            {/* Empty state */}
            {!result && !loading && (
              <div className={`rounded-2xl border border-dashed p-8 flex flex-col items-center justify-center gap-3 text-center ${dark ? 'border-white/8' : 'border-black/10'}`}>
                <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${dark ? 'bg-white/5' : 'bg-black/5'}`}>
                  <ScanIcon />
                </div>
                <p className={`text-sm ${dark ? 'text-gray-500' : 'text-gray-400'}`}>
                  Results will appear here after analysis
                </p>
              </div>
            )}

            {/* Score Legend */}
            <div className={`rounded-xl border p-4 ${dark ? 'bg-black/20 border-white/5' : 'bg-white/60 border-black/5'}`}>
              <p className={`text-xs font-semibold mb-3 ${dark ? 'text-gray-400' : 'text-gray-500'}`}>CONFIDENCE GUIDE</p>
              {[
                { range: '85–100%', label: 'Very certain', color: 'bg-indigo-500' },
                { range: '65–84%', label: 'Likely', color: 'bg-indigo-400' },
                { range: '50–64%', label: 'Slight lean', color: 'bg-indigo-300' },
              ].map(({ range, label, color }) => (
                <div key={range} className="flex items-center gap-2 mb-1.5">
                  <div className={`w-2 h-2 rounded-full ${color}`} />
                  <span className={`text-xs ${dark ? 'text-gray-400' : 'text-gray-500'}`}>{range}</span>
                  <span className={`text-xs ml-auto ${dark ? 'text-gray-500' : 'text-gray-400'}`}>{label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* History Panel */}
        {showHistory && (
          <div className={`mt-6 rounded-2xl border ${dark ? 'bg-black/30 border-white/8' : 'bg-white border-black/8'} glass animate-slide-up`}>
            <div className={`px-5 py-4 border-b flex items-center justify-between ${dark ? 'border-white/5' : 'border-black/5'}`}>
              <span className="font-semibold text-sm">Recent Checks</span>
              {history.length > 0 && (
                <button
                  onClick={() => setHistory([])}
                  className={`flex items-center gap-1.5 text-xs transition-colors ${dark ? 'text-gray-500 hover:text-red-400' : 'text-gray-400 hover:text-red-500'}`}
                >
                  <TrashIcon /> Clear all
                </button>
              )}
            </div>
            {history.length === 0 ? (
              <p className={`px-5 py-6 text-sm text-center ${dark ? 'text-gray-600' : 'text-gray-400'}`}>No history yet.</p>
            ) : (
              <div className="divide-y divide-white/5">
                {history.map(item => (
                  <div key={item.id} className={`history-item px-5 py-4 flex items-center gap-4 cursor-pointer hover:bg-white/2 ${dark ? 'hover:bg-white/2' : 'hover:bg-black/2'}`}
                    onClick={() => { setText(item.preview); setShowHistory(false); }}>
                    <div className={`w-2 h-2 rounded-full flex-shrink-0 ${item.label === 'AI Generated' ? 'bg-red-400' : 'bg-green-400'}`} />
                    <div className="flex-1 min-w-0">
                      <p className={`text-sm truncate ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{item.preview}</p>
                      <p className={`text-xs mt-0.5 ${dark ? 'text-gray-600' : 'text-gray-400'}`}>{item.date} · {item.timestamp}</p>
                    </div>
                    <div className="flex flex-col items-end gap-1">
                      <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                        item.label === 'AI Generated'
                          ? dark ? 'bg-red-500/15 text-red-400' : 'bg-red-100 text-red-600'
                          : dark ? 'bg-green-500/15 text-green-400' : 'bg-green-100 text-green-600'
                      }`}>
                        {item.label === 'AI Generated' ? 'AI' : 'Human'}
                      </span>
                      <span className={`text-xs ${dark ? 'text-gray-500' : 'text-gray-400'}`}>{item.confidence}%</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Sample texts */}
        <div className="mt-8">
          <p className={`text-xs font-semibold mb-3 ${dark ? 'text-gray-500' : 'text-gray-400'}`}>TRY SAMPLE TEXTS</p>
          <div className="flex flex-wrap gap-2">
            {[
              { label: '🤖 Likely AI', text: "Artificial intelligence represents a transformative paradigm shift in modern technological development. Furthermore, it is important to acknowledge that machine learning algorithms leverage complex neural architectures to facilitate comprehensive data analysis. Additionally, these systems demonstrate robust performance across multifaceted domains, providing holistic solutions to contemporary challenges." },
              { label: '✍️ Likely Human', text: "I've been trying to learn guitar for like 3 months now and honestly it's way harder than I thought lol. My fingers hurt constantly and I still can't nail the F chord... but hey, I did manage to play the full intro of Wonderwall yesterday so that's something I guess! Anyone else struggle this much at the start?" },
              { label: '📝 Ambiguous', text: "The study found interesting correlations between sleep patterns and cognitive performance. Participants who slept less than six hours showed measurable declines in memory tests. However, the sample size was relatively small at just 42 individuals, so we should be careful about drawing broad conclusions from this data." },
            ].map(({ label, text: sampleText }) => (
              <button
                key={label}
                onClick={() => { setText(sampleText); setResult(null); setError(''); }}
                className={`text-xs px-3 py-1.5 rounded-lg border transition-all ${dark ? 'border-white/10 hover:bg-white/5 text-gray-400 hover:text-gray-200' : 'border-black/10 hover:bg-black/5 text-gray-500 hover:text-gray-700'}`}
              >
                {label}
              </button>
            ))}
          </div>
        </div>
      </main>

      {/* Footer */}
      <footer className={`relative z-10 mt-16 py-6 text-center text-xs border-t ${dark ? 'border-white/5 text-gray-600' : 'border-black/5 text-gray-400'}`}>
        TextTruth AI · AI vs Human Text Detector · Built with React + Flask + RoBERTa
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
